<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página no encontrada - 404</title>
    <link rel="stylesheet" href="/static/styles/main.css">
    <style>
        .error-404 {
            text-align: center;
            padding: 80px 20px;
        }
        .error-404 h1 {
            font-size: 4em;
            color: #d32f2f;
        }
        .error-404 p {
            font-size: 1.5em;
            margin: 20px 0;
        }
        .error-404 a {
            color: #1976d2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-404">
        <h1>404</h1>
        <p>¡Ups! La página que buscas no existe.</p>
        <a href="/">Volver al inicio</a>
    </div>
</body>
</html>
