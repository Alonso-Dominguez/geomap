<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - IUCA Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body class="admin-body">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img src="{{ url_for('static', filename='assets/geomapp.png') }}" alt="IUCA" id="logo-sidebar" />
          <span class="sidebar-logo-text">Admin</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="{{ url_for('admin_dashboard') }}" class="sidebar-link">
          <svg width="20" height="20" fill="none" viewBox="0 0 20 20">
            <rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Dashboard</span>
        </a>

        <a href="{{ url_for('admin_municipios') }}" class="sidebar-link">
          <svg width="20" height="20" fill="none" viewBox="0 0 20 20">
            <path d="M10 2C6.13 2 3 5.13 3 9C3 13.25 10 20 10 20C10 20 17 13.25 17 9C17 5.13 13.87 2 10 2Z" stroke="currentColor" stroke-width="2"/>
            <circle cx="10" cy="9" r="2" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Municipios</span>
        </a>

        <a href="{{ url_for('admin_citas') }}" class="sidebar-link">
          <svg width="20" height="20" fill="none" viewBox="0 0 20 20">
            <rect x="4" y="5" width="12" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M7 3V5M13 3V5M4 8H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Citas</span>
        </a>

        <a href="{{ url_for('admin_mapa') }}" class="sidebar-link">
          <svg width="20" height="20" fill="none" viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="M10 2C10 2 13 6 13 10C13 14 10 18 10 18M10 2C10 2 7 6 7 10C7 14 10 18 10 18M2 10H18" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Mapa</span>
        </a>
        <a href="{{ url_for('admin_cuestionario') }}" class="sidebar-link">
          <svg width="20" height="20" fill="none" viewBox="0 0 20 20">
            <path d="M10 3L3 7V13L10 17L17 13V7L10 3Z" stroke="currentColor" stroke-width="2"/>
            <path d="M10 7V13" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Cuestionario</span>
        </a>
        <a href="{{ url_for('admin_configuracion') }}" class="sidebar-link active">
          <svg width="20" height="20" fill="none" viewBox="0 0 20 20">
            <path d="M3 6L10 2L17 6V14L10 18L3 14V6Z" stroke="currentColor" stroke-width="2" />
          </svg>
          <span>Configuración</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">
            <svg width="32" height="32" fill="none" viewBox="0 0 32 32">
              <circle cx="16" cy="16" r="14" fill="#B0BAE0"/>
              <circle cx="16" cy="13" r="5" fill="#0F1F45"/>
              <path d="M6 28C6 23 10 19 16 19C22 19 26 23 26 28" fill="#0F1F45"/>
            </svg>
          </div>
          <div class="user-info">
            <div class="user-name">Administrador</div>
            <div class="user-role">Admin IUCA</div>
          </div>
        </div>

        <button onclick="cerrarSesion()" class="btn-logout">
          <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
            <path d="M7 16H3C2.4 16 2 15.5 2 15V3C2 2.4 2.4 2 3 2H7M12 13L16 9M16 9L12 5M16 9H7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-content">
          <div class="topbar-title">
            <h1>Configuración del Sistema</h1>
            <p class="topbar-subtitle">Preferencias generales del panel administrativo</p>
          </div>
        </div>
      </header>

      <div class="dashboard-content">

        <!-- Ajustes Generales -->
        <div class="table-card" style="padding: 2rem; margin-bottom: 2rem;">
          <h3 class="table-title">Ajustes Generales</h3>

          <div class="form-group mt-3">
            <label class="form-label">Nombre del Sistema</label>
            <input type="text" class="form-input" value="IUCA Admin" id="systemName" />
          </div>

          <div class="form-group">
            <label class="form-label">Correo de Soporte</label>
            <input type="email" class="form-input" value="soporte@iuca.mx" id="systemEmail" />
          </div>

          <div class="form-group">
            <label class="form-label">Zona Horaria</label>
            <select class="form-select" id="timezone">
              <option>America/Mexico_City</option>
              <option>America/Monterrey</option>
              <option>America/Tijuana</option>
            </select>
          </div>

        </div>

        <!-- Apariencia -->
        <div class="table-card" style="padding: 2rem; margin-bottom: 2rem;">
          <h3 class="table-title">Apariencia</h3>

          <div class="form-group mt-3">
            <label class="form-label">Tema</label>
            <select class="form-select">
              <option value="light">Claro (predeterminado)</option>
              <option value="dark">Oscuro</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Logo del Sistema</label>
            <input type="file" class="form-input" />
          </div>
        </div>

        <!-- Seguridad -->
        <div class="table-card" style="padding: 2rem;">
          <h3 class="table-title">Seguridad y Sesión</h3>

          <div class="form-group mt-3">
            <label class="form-label">Tiempo máximo de sesión (minutos)</label>
            <input type="number" class="form-input" value="30" />
          </div>

          <div class="form-group">
            <label class="form-label">Autenticación</label>
            <select class="form-select">
              <option>Solo contraseña</option>
              <option>Contraseña + código SMS</option>
            </select>
          </div>

          <button class="btn btn-primary mt-3">Guardar Cambios</button>
        </div>

      </div>
    </main>
  </body>
</html>
