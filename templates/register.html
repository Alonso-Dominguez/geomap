
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registro de Usuario - IUCA</title>
        <meta name="description" content="Registro de usuario para el sistema de diagnóstico catastral" />
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </head>
    <body>
        <section class="admin-login-section">
            <div class="login-container">
                <!-- Left Panel - Branding -->
                <div class="login-brand-panel">
                    <div class="brand-content">
                        <div class="brand-logo">
                            <img src="{{ url_for('static', filename='assets/geomapp.png') }}" alt="IUCA" id="logo-iuca-login" />
                        </div>
                        <h1 class="brand-title">Panel de Registro</h1>
                        <p class="brand-subtitle">Crea tu cuenta para acceder al sistema IUCA</p>
                        <div class="brand-features">
                            <div class="brand-feature-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                    <path d="M9 11L12 14L22 4M21 12V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                <span>Gestión de usuarios</span>
                            </div>
                            <div class="brand-feature-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="#FFFFFF" stroke-width="2"/>
                                    <path d="M3 9H21M9 3V21" stroke="#FFFFFF" stroke-width="2" />
                                </svg>
                                <span>Acceso seguro</span>
                            </div>
                            <div class="brand-feature-item">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" stroke="#FFFFFF" stroke-width="2"/>
                                    <circle cx="12" cy="9" r="2.5" stroke="#FFFFFF" stroke-width="2"/>
                                </svg>
                                <span>Soporte IUCA</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Right Panel - Register Form -->
                <div class="login-form-panel">
                    <div class="login-form-content">
                        <div class="login-header">
                            <h2 class="login-title">Crear cuenta</h2>
                            <p class="login-subtitle">Regístrate para acceder al sistema</p>
                        </div>
                        <form id="registerForm" class="admin-login-form" method="POST" action="/api/register">
                            <div class="form-group">
                                <label for="usuario" class="form-label">Usuario</label>
                                <div class="input-with-icon">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                        <circle cx="10" cy="7" r="4" stroke="#B8C4CC" stroke-width="2"/>
                                        <path d="M3 18C3 14 6 11 10 11C14 11 17 14 17 18" stroke="#B8C4CC" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                    <input type="text" id="usuario" name="usuario" class="form-input input-with-icon-field" required placeholder="Tu usuario" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <div class="input-with-icon">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                        <rect x="3" y="5" width="14" height="10" rx="2" stroke="#B8C4CC" stroke-width="2"/>
                                        <path d="M3 7L10 11L17 7" stroke="#B8C4CC" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                    <input type="email" id="email" name="email" class="form-input input-with-icon-field" required placeholder="tucorreo@iuca.com" />
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="password" class="form-label">Contraseña</label>
                                <div class="input-with-icon">
                                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                        <rect x="5" y="9" width="10" height="8" rx="1" stroke="#B8C4CC" stroke-width="2"/>
                                        <path d="M7 9V6C7 4.34315 8.34315 3 10 3C11.6569 3 13 4.34315 13 6V9" stroke="#B8C4CC" stroke-width="2"/>
                                    </svg>
                                    <input type="password" id="password" name="password" class="form-input input-with-icon-field" required placeholder="••••••••" />
                                    <button type="button" class="password-toggle" onclick="togglePassword('password')">
                                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                            <path d="M10 7C8.34315 7 7 8.34315 7 10C7 11.6569 8.34315 13 10 13C11.6569 13 13 11.6569 13 10C13 8.34315 11.6569 7 10 7Z" stroke="#B8C4CC" stroke-width="2"/>
                                            <path d="M10 3C5 3 1 10 1 10C1 10 5 17 10 17C15 17 19 10 19 10C19 10 15 3 10 3Z" stroke="#B8C4CC" stroke-width="2"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="checkbox-label checkbox-remember">
                                    <input type="checkbox" name="recordar" id="recordarRegister" />
                                    <span>Recordar mi sesión</span>
                                </label>
                            </div>
                            <div class="login-alert" id="registerAlert" style="display: none"></div>
                            <button type="submit" class="btn btn-primary btn-large btn-full">Registrarse</button>
                        </form>
                        <div class="login-footer">
                            <p class="login-help">¿Ya tienes cuenta? <a href="/admin-login">Inicia sesión aquí</a></p>
                            <a href="{{ url_for('index') }}" class="login-back-link">← Volver al sitio público</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <script>
            function togglePassword(id) {
                var input = document.getElementById(id);
                if (input.type === "password") {
                    input.type = "text";
                } else {
                    input.type = "password";
                }
            }
        </script>
    </body>
</html>
